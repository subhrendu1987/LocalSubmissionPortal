<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generate C Assignment</title>
<style>
body{margin:0;background:#10151d;color:#e8edf5;font:16px/1.5 system-ui;display:grid;place-items:center;min-height:100vh;padding:24px}main{width:min(100%,650px);background:#1a2330;border:1px solid #344256;border-radius:14px;padding:28px}h1{margin-top:0}p,small{color:#b8c4d5}label{display:block;margin:14px 0 5px;font-weight:600}input,select{width:100%;padding:11px;border:1px solid #526176;border-radius:8px;background:#0e1621;color:white}button{margin-top:22px;width:100%;padding:13px;border:0;border-radius:8px;background:#4f8cff;color:white;font-weight:700;cursor:pointer}.notice{padding:10px;border-radius:8px;background:#512c34;color:#ffdce2;margin:12px 0}a{color:#8bb6ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>Generate your C assignment file</h1><p>Enter your details. Your roll number must match the official class database.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="notice">{{message}}</div>{% endfor %}{% endwith %}
<form method="post"><div class="grid">
<div><label>University roll number</label><input name="roll_no" required placeholder="SAU/CS/BTECH/CS/2024/11"></div>
<div><label>Section</label><input name="section" required placeholder="CSE001"></div>
<div><label>Full name</label><input name="name" required></div>
<div><label>Institutional email</label><input name="email" type="email" required></div>
<div><label>Alternate email (optional)</label><input name="alternate_email" type="email"></div>
<div><label>System number</label><input name="system_no" required placeholder="19"></div></div>
<label>Assigned question</label><select name="question_id" required><option value="">-- Select question --</option>{% for q in questions %}<option value="{{q.question_id}}">{{q.question_id}} — {{q.title}}</option>{% endfor %}</select>
<button type="submit">Generate and download .c file</button></form><p><a href="{{url_for('upload')}}">Already completed? Upload your C file</a></p></main></body></html>
